name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes, 24/7/365
    - cron: "*/10 * * * *"
  # Allow manual trigger from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        run: |
          echo "Pinging Render backend to prevent sleep..."
          curl -I -s -o /dev/null -w "HTTP Response Status: %{http_code}\n" https://che-resource-hub-2.onrender.com/api/health
          echo "Ping completed successfully!"
