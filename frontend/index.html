<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChE Study Hub | Chemical Engineering Resource Space</title>
    <link rel="icon" type="image/png" href="che_hub_logo.png">
    
    <!-- Google Fonts: Inter for reading body, Outfit for headers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#FFFFFF',
                            100: '#E2E8F0',
                            800: '#2D3748',
                            900: '#1A1C28',
                            950: '#161824',
                        },
                        slate: {
                            50: '#E2E8F0',
                            100: '#E2E8F0',
                            200: '#CBD5E1',
                            300: '#94A3B8',
                            400: '#94A3B8',
                            500: '#94A3B8',
                            600: '#94A3B8',
                            700: '#CBD5E1',
                            800: '#E2E8F0',
                            900: '#F1F5F9',
                        },
                        sky: {
                            50: 'rgba(49, 151, 149, 0.15)',
                            100: 'rgba(49, 151, 149, 0.15)',
                            200: 'rgba(49, 151, 149, 0.15)',
                            300: '#4FD1C5',
                            400: '#4FD1C5',
                            500: '#4FD1C5',
                            600: '#4FD1C5',
                            700: '#4FD1C5',
                            950: 'rgba(49, 151, 149, 0.15)',
                        },
                        violet: {
                            50: 'rgba(49, 151, 149, 0.15)',
                            100: 'rgba(49, 151, 149, 0.15)',
                            200: 'rgba(49, 151, 149, 0.15)',
                            300: '#4FD1C5',
                            400: '#4FD1C5',
                            500: '#4FD1C5',
                            600: '#4FD1C5',
                            700: '#4FD1C5',
                            950: 'rgba(49, 151, 149, 0.15)',
                        },
                        accent: {
                            sky: '#5A8DDE',      // Primary Muted Azure
                            violet: '#5A8DDE',   // Map to Azure for solid button accents
                            rose: '#E53E3E',
                            blue: '#4299E1',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl': '12px',
                        '2xl': '12px',
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    
    <!-- Global CSS for animations and scrollbars -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1c28 !important;
            color: #E2E8F0 !important;
            overflow-x: hidden;
        }
        
        /* Modern Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1c28;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(90, 141, 222, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(90, 141, 222, 0.6);
        }
        
        /* Modern Clean Card/Panel Classes */
        .glass-panel {
            background: #222536;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
        }
        .glass-card {
            background: #222536;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: #282c40;
            border-color: rgba(90, 141, 222, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.25), 0 4px 6px -2px rgba(0, 0, 0, 0.15);
        }
        .glass-input {
            background: #161824;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #E2E8F0;
            border-radius: 12px;
            transition: all 0.2s ease-in-out;
        }
        .glass-input:focus {
            background: #1c1f2e;
            border-color: #5A8DDE;
            outline: none;
            box-shadow: 0 0 0 2px rgba(90, 141, 222, 0.2);
        }
        
        /* Typography & Overrides */
        h1.text-white, h2.text-white, h3.text-white, h4.text-white, h5.text-white, h6.text-white,
        .text-white {
            color: #E2E8F0 !important;
            text-shadow: none !important;
        }
        
        /* Ensure white text is retained on buttons and badges with backgrounds */
        .bg-gradient-to-r.text-white,
        .bg-gradient-to-tr.text-white,
        button.text-white,
        a.text-white,
        .bg-accent-sky.text-white,
        .bg-sky-600.text-white,
        button.bg-accent-sky,
        button.bg-sky-600 {
            color: #FFFFFF !important;
        }
        
        /* Handle specific link hover effects to turn into Azure instead of white */
        .hover\:text-white:hover {
            color: #5A8DDE !important;
        }
        .bg-accent-sky.hover\:bg-sky-600:hover, 
        .bg-sky-600:hover,
        .hover\:bg-sky-600:hover,
        button.hover\:text-white:hover {
            color: #FFFFFF !important;
        }
        .group:hover p.group-hover\:text-white {
            color: #5A8DDE !important;
        }

        /* Soft Teal Badges styling */
        .bg-sky-500\/20, .bg-sky-500\/10, .bg-accent-sky\/20, .bg-accent-sky\/10, .bg-violet-500\/10, .bg-violet-500\/20 {
            background-color: rgba(49, 151, 149, 0.15) !important;
            color: #4FD1C5 !important;
            border-color: rgba(49, 151, 149, 0.2) !important;
        }
        .text-sky-300, .text-accent-sky, .text-accent-violet, .text-violet-300 {
            color: #4FD1C5 !important;
        }
        /* Except when buttons or specific layouts want Azure */
        .text-accent-sky.text-white, button .text-accent-sky, .bg-gradient-to-r .text-accent-sky {
            color: #FFFFFF !important;
        }
        
        /* Premium Gradients */
        .text-glow {
            text-shadow: 0 0 10px rgba(90, 141, 222, 0.15);
        }
        .gradient-text {
            background: linear-gradient(135deg, #5A8DDE 0%, #4FD1C5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Header dividers */
        header div.bg-white, header div.bg-white.bg-opacity-10 {
            background-color: rgba(255, 255, 255, 0.08) !important;
            opacity: 1 !important;
        }
        
        /* Dropdown Options */
        select option {
            background-color: #222536 !important;
            color: #E2E8F0 !important;
        }
        
        /* Markdown Styling overrides for Dim Theme */
        .prose h1 { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 700; color: #E2E8F0; margin-top: 1.5rem; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.3rem;}
        .prose h2 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 600; color: #CBD5E1; margin-top: 1.2rem; margin-bottom: 0.6rem; }
        .prose h3 { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 600; color: #94A3B8; margin-top: 1rem; margin-bottom: 0.4rem; }
        .prose p { margin-bottom: 0.8rem; line-height: 1.6; color: #CBD5E1; }
        .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 0.8rem; list-style-type: disc; }
        .prose li { margin-bottom: 0.3rem; color: #CBD5E1; }
        .prose table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; background: #222536; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
        .prose th { background: rgba(90, 141, 222, 0.15); padding: 0.6rem; font-family: 'Outfit', sans-serif; text-align: left; font-weight: 600; border: 1px solid rgba(255,255,255,0.08); color: #E2E8F0; }
        .prose td { padding: 0.6rem; border: 1px solid rgba(255,255,255,0.05); color: #CBD5E1; }
        .prose tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
        .prose code { background: rgba(90, 141, 222, 0.15); color: #4FD1C5; padding: 0.15rem 0.3rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .prose pre { background: #161824; border: 1px solid rgba(255,255,255,0.08); padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1rem; }
        .prose pre code { background: transparent; color: #E2E8F0; padding: 0; }
        .prose blockquote { border-left: 4px solid #5A8DDE; padding-left: 1rem; margin-left: 0.5rem; margin-bottom: 1rem; font-style: italic; color: #94A3B8; }
    </style>
    
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for on-the-fly JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Marked Markdown Parser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- MathJax for rendering LaTeX math equations dynamically on-the-fly -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
</head>
<body class="h-full bg-dark-950 text-slate-100 flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>
    
    <!-- Modular JSX logic loaded below -->
    <script type="text/babel" src="app.js?v=5.9"></script>
</body>
</html>
