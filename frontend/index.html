<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChE Study Hub | Chemical Engineering Resource Space</title>
    <link rel="icon" type="image/png" href="che_hub_logo.png">
    
    <!-- Google Fonts: Inter for reading body, Outfit for headers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#F8FAFC',
                            100: '#F1F5F9',
                            800: '#1A233A',
                            900: '#0B132B',
                            950: '#050B1E',
                        },
                        slate: {
                            50: '#FFFFFF',
                            100: '#FFFFFF',
                            200: '#F8FAFC',
                            300: '#E2E8F0',
                            400: '#CBD5E1',
                            500: '#94A3B8',
                            600: '#94A3B8',
                            700: '#CBD5E1',
                            800: '#FFFFFF',
                            900: '#F8FAFC',
                        },
                        sky: {
                            50: 'rgba(167, 139, 250, 0.15)',
                            100: 'rgba(167, 139, 250, 0.15)',
                            200: 'rgba(167, 139, 250, 0.15)',
                            300: '#C4B5FD',
                            400: '#C4B5FD',
                            500: '#A78BFA',
                            600: '#A78BFA',
                            700: '#A78BFA',
                            950: 'rgba(167, 139, 250, 0.15)',
                        },
                        violet: {
                            50: 'rgba(167, 139, 250, 0.15)',
                            100: 'rgba(167, 139, 250, 0.15)',
                            200: 'rgba(167, 139, 250, 0.15)',
                            300: '#C4B5FD',
                            400: '#C4B5FD',
                            500: '#A78BFA',
                            600: '#A78BFA',
                            700: '#A78BFA',
                            950: 'rgba(167, 139, 250, 0.15)',
                        },
                        accent: {
                            sky: '#38BDF8',      // Sky Blue accents
                            violet: '#A78BFA',   // Violet accents
                            rose: '#F43F5E',
                            blue: '#60A5FA',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl': '12px',
                        '2xl': '12px',
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    
    <!-- Global CSS for animations and scrollbars -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #0D1B3E 0%, #050B1E 70%, #020510 100%) !important;
            color: #FFFFFF !important;
            overflow-x: hidden;
        }
        
        /* Modern Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050B1E;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(167, 139, 250, 0.6);
        }
        
        /* Modern Clean Card/Panel Classes */
        .glass-panel {
            background: rgba(11, 19, 43, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            border-radius: 12px;
        }
        .glass-card {
            background: rgba(11, 19, 43, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(11, 19, 43, 0.6);
            border-color: rgba(167, 139, 250, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 4px 10px rgba(167, 139, 250, 0.1);
        }
        .glass-input {
            background: rgba(5, 11, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border-radius: 12px;
            transition: all 0.2s ease-in-out;
        }
        .glass-input:focus {
            background: rgba(5, 11, 30, 0.85);
            border-color: #A78BFA;
            outline: none;
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
        }
        
        /* Typography & Overrides */
        h1.text-white, h2.text-white, h3.text-white, h4.text-white, h5.text-white, h6.text-white,
        .text-white {
            color: #FFFFFF !important;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.2) !important;
        }
        
        /* Ensure white text is retained on buttons and badges with backgrounds */
        .bg-gradient-to-r.text-white,
        .bg-gradient-to-tr.text-white,
        button.text-white,
        a.text-white,
        .bg-accent-sky.text-white,
        .bg-sky-600.text-white,
        button.bg-accent-sky,
        button.bg-sky-600 {
            color: #FFFFFF !important;
        }
        
        /* Handle specific link hover effects to turn into Violet instead of white */
        .hover\:text-white:hover {
            color: #A78BFA !important;
        }
        .bg-accent-sky.hover\:bg-sky-600:hover, 
        .bg-sky-600:hover,
        .hover\:bg-sky-600:hover,
        button.hover\:text-white:hover {
            color: #FFFFFF !important;
        }
        .group:hover p.group-hover\:text-white {
            color: #A78BFA !important;
        }

        /* Soft Teal Badges styling */
        .bg-sky-500\/20, .bg-sky-500\/10, .bg-accent-sky\/20, .bg-accent-sky\/10, .bg-violet-500\/10, .bg-violet-500\/20 {
            background-color: rgba(167, 139, 250, 0.15) !important;
            color: #C4B5FD !important;
            border-color: rgba(167, 139, 250, 0.3) !important;
        }
        .text-sky-300, .text-accent-sky, .text-accent-violet, .text-violet-300 {
            color: #C4B5FD !important;
        }
        /* Except when buttons or specific layouts want Violet */
        .text-accent-sky.text-white, button .text-accent-sky, .bg-gradient-to-r .text-accent-sky {
            color: #FFFFFF !important;
        }
        
        /* Premium Gradients */
        .text-glow {
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.25);
        }
        .gradient-text {
            background: linear-gradient(135deg, #A78BFA 0%, #38BDF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Header dividers */
        header div.bg-white, header div.bg-white.bg-opacity-10 {
            background-color: rgba(255, 255, 255, 0.12) !important;
            opacity: 1 !important;
        }
        
        /* Dropdown Options */
        select option {
            background-color: #0B132B !important;
            color: #FFFFFF !important;
        }
        
        /* Markdown Styling overrides for Dim Theme */
        .prose h1 { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 700; color: #FFFFFF; margin-top: 1.5rem; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.3rem;}
        .prose h2 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 600; color: #F8FAFC; margin-top: 1.2rem; margin-bottom: 0.6rem; }
        .prose h3 { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 600; color: #CBD5E1; margin-top: 1rem; margin-bottom: 0.4rem; }
        .prose p { margin-bottom: 0.8rem; line-height: 1.6; color: #CBD5E1; }
        .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 0.8rem; list-style-type: disc; }
        .prose li { margin-bottom: 0.3rem; color: #CBD5E1; }
        .prose table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; background: rgba(11, 19, 43, 0.45); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .prose th { background: rgba(167, 139, 250, 0.15); padding: 0.6rem; font-family: 'Outfit', sans-serif; text-align: left; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); color: #FFFFFF; }
        .prose td { padding: 0.6rem; border: 1px solid rgba(255,255,255,0.05); color: #CBD5E1; }
        .prose tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
        .prose code { background: rgba(167, 139, 250, 0.15); color: #C4B5FD; padding: 0.15rem 0.3rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .prose pre { background: rgba(5, 11, 30, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1rem; }
        .prose pre code { background: transparent; color: #FFFFFF; padding: 0; }
        .prose blockquote { border-left: 4px solid #A78BFA; padding-left: 1rem; margin-left: 0.5rem; margin-bottom: 1rem; font-style: italic; color: #CBD5E1; }
    </style>
    
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for on-the-fly JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Marked Markdown Parser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- MathJax for rendering LaTeX math equations dynamically on-the-fly -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
</head>
<body class="h-full bg-dark-950 text-slate-100 flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>
    
    <!-- Modular JSX logic loaded below -->
    <script type="text/babel" src="app.js?v=5.9"></script>
</body>
</html>
