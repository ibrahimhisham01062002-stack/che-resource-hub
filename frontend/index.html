    <!-- Global Fail-safe Script Error Recovery Listener -->

        window.addEventListener('error', function(e) {
            console.error("Global captured error:", e);

                root.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-[#161924] p-6 font-sans">

                            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-[#D9534F]">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" class="w-8 h-8">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                </svg>
                            </div>
                            <h2 class="font-display font-extrabold text-xl mb-2 text-[#1E2538]" style="font-weight: 800 !important;">Failed to Load Study Space</h2>
                            <p class="text-[#3A4454] text-sm mb-6 leading-relaxed" style="font-weight: 500 !important;">
                                This may be caused by a slow mobile connection, content blockers, or an incompatible browser. Please try reloading the page or disabling private mode.
                            </p>
                            <button onclick="window.location.reload(true)" class="w-full bg-[#5C061C] hover:bg-[#7A0D22] text-white font-extrabold py-3 px-4 rounded-xl border border-white/20 transition-all hover:scale-[1.02] shadow-md cursor-pointer" style="font-weight: 800 !important; color: #FFFFFF !important;">
                                Reload Resources
                            </button>
                            <div class="mt-4 text-[10px] text-[#718096] truncate">
                                Error: ${e.message || "Script compilation/loading failed"}
                            </div>
                        </div>
                    </div>
                `;
            }
        }, true);
    </script>
